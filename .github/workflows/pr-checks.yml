name: PR Checks

# Runs on every PR targeting dev. All jobs must pass before merge is allowed.
# This is a required status check — configure branch protection on `dev` to require it.

on:
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    # This is director-security / appsec-team-lead's release-blocking authority
    # enforced as code. Do not make this job optional or allow-failure.
    steps:
      - uses: actions/checkout@v4
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
      - name: SAST scan
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3

  build:
    name: Build verification
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  ticket-reference-check:
    name: Verify ticket reference
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for Ticket ID
        # PR_BODY passed via env, NOT interpolated directly into the script below.
        # A prior version wrote `echo "${{ github.event.pull_request.body }}"` inline,
        # which GitHub Actions substitutes into the YAML *before* the shell ever runs it
        # — so a PR body containing backticks or `$(...)` (ordinary Markdown code spans,
        # e.g. an inline reference to a filename) became literal shell source. Found
        # 2026-08-26 when a legitimate PR body full of backtick-quoted filenames caused
        # silent "command not found" errors in this step that didn't fail the check —
        # a real bypass of a real security gate, not a cosmetic bug. `env:` + `"$VAR"`
        # is the standard fix: the shell sees PR_BODY as an opaque string, never as code.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qE 'TCK-[0-9]+' <<< "$PR_BODY"; then
            echo "::error::PR description must reference a Notion Ticket ID (e.g. 'Closes TCK-142')."
            exit 1
          fi

  approval-record-check:
    name: Verify APPROVED-BY line
    runs-on: ubuntu-latest
    # This is the real merge-authorization gate given the single shared GitHub account —
    # see _protocol/04-git-cicd-protocol.md Section 0. GitHub's native "required reviewers"
    # feature is not used here because it assumes separate reviewer identities.
    steps:
      - name: Check PR body for an APPROVED-BY line
        # See the ticket-reference-check step's comment above — same fix, same reason.
        # This one matters more: it's the actual merge-authorization gate, and the
        # injection bug meant a PR body with ordinary backtick-quoted code references
        # could report APPROVED-BY as present when it wasn't, silently defeating the one
        # mechanism this org substitutes for GitHub's native reviewer approval. Found
        # 2026-08-26, before it was exploited (accidentally or otherwise) to actually
        # merge anything.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qE 'APPROVED-BY:\s*\S+' <<< "$PR_BODY"; then
            echo "::error::PR description must include 'APPROVED-BY: <agent_id>' matching an"
            echo "'APPROVED-FOR-MERGE' entry already recorded in the linked Notion ticket's Notes."
            echo "This is the merge-authorization record required by _protocol/04-git-cicd-protocol.md."
            exit 1
          fi
      - name: Reminder
        run: |
          echo "This check only verifies the PR body has the line — it does not verify the"
          echo "Notion Notes entry actually exists. The merging agent is responsible for checking"
          echo "that before merging. A future improvement would call the Notion API here directly."
